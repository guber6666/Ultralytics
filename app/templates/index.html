<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 目标检测系统</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M9 9h6v6H9zM17 17h6v6h-6z' fill='white' fill-opacity='.9'/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background:
                radial-gradient(1000px 500px at 85% -10%, rgba(99, 102, 241, 0.08), transparent 60%),
                radial-gradient(800px 400px at -10% 30%, rgba(168, 85, 247, 0.06), transparent 60%),
                radial-gradient(600px 500px at 50% 110%, rgba(14, 165, 233, 0.05), transparent 60%),
                #f8fafc;
        }

        .tabular {
            font-variant-numeric: tabular-nums;
        }

        /* 入场动画 */
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-enter {
            animation: fadeSlideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .animate-enter-delay-1 { animation-delay: 0.06s; }
        .animate-enter-delay-2 { animation-delay: 0.12s; }
        .animate-enter-delay-3 { animation-delay: 0.18s; }

        /* 卡片悬停微浮起 */
        .card-hover {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px -8px rgba(15, 23, 42, 0.12);
        }

        /* 状态点呼吸 */
        @keyframes statusPing {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.45); }
            70% { box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }
        @keyframes statusPingOk {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.45); }
            70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .status-dot-pending { animation: statusPing 2s infinite; }
        .status-dot-ok { animation: statusPingOk 2s infinite; }

        /* 滑块 */
        .range-input {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 5px;
            border-radius: 9999px;
            background: linear-gradient(90deg, #4f46e5 var(--fill, 50%), #e2e8f0 var(--fill, 50%));
            outline: none;
        }

        .range-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 9999px;
            background: #ffffff;
            border: 3px solid #4f46e5;
            box-shadow: 0 2px 6px rgba(79, 70, 229, 0.35);
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        .range-input::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        .range-input::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 9999px;
            background: #ffffff;
            border: 3px solid #4f46e5;
            box-shadow: 0 2px 6px rgba(79, 70, 229, 0.35);
            cursor: pointer;
        }

        .preview-content img,
        .preview-content video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 0.75rem;
        }

        .loading {
            display: none;
        }

        .loading.active {
            display: flex;
        }

        /* 进度条 */
        .progress-track {
            height: 6px;
            border-radius: 9999px;
            background: rgba(99, 102, 241, 0.15);
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 9999px;
            background: linear-gradient(90deg, #4f46e5, #a855f7);
            transition: width 0.3s ease;
        }
        @keyframes indeterminate {
            0% { margin-left: -40%; }
            100% { margin-left: 100%; }
        }
        .progress-fill.indeterminate {
            width: 40%;
            animation: indeterminate 1.2s ease-in-out infinite;
        }

        /* 空状态虚线区 */
        .empty-state {
            border: 2px dashed #cbd5e1;
            border-radius: 0.75rem;
            transition: border-color 0.25s ease, background-color 0.25s ease;
        }
        .preview-content:hover .empty-state {
            border-color: #a5b4fc;
            background-color: rgba(238, 242, 255, 0.5);
        }

        @media (prefers-reduced-motion: reduce) {
            .animate-enter, .status-dot-pending, .status-dot-ok, .progress-fill.indeterminate {
                animation: none;
            }
            .card-hover:hover {
                transform: none;
            }
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen p-4 md:p-6">
    <div class="max-w-7xl mx-auto bg-white/90 backdrop-blur rounded-2xl shadow-lg shadow-slate-200/60 border border-slate-200/80 overflow-hidden animate-enter">
        <header class="relative border-b border-slate-200/80 px-6 py-5 md:px-8 md:py-6 bg-gradient-to-r from-indigo-50/60 via-white to-fuchsia-50/50">
            <div class="flex items-center gap-3">
                <span class="inline-flex items-center justify-center h-11 w-11 rounded-xl bg-gradient-to-br from-indigo-600 to-purple-600 text-white shadow-lg shadow-indigo-500/30 shrink-0">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h7v7H4z"/><path d="M13 13h7v7h-7z"/><path d="M13 4h7v4h-7zM4 13h7v4H4z" stroke-opacity="0.5"/></svg>
                </span>
                <div>
                    <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-600 via-purple-600 to-fuchsia-600 bg-clip-text text-transparent">AI 目标检测系统</h1>
                    <p class="text-sm md:text-base text-slate-500 mt-0.5">基于深度学习的智能目标识别平台</p>
                </div>
            </div>
            <div class="absolute inset-x-0 bottom-0 h-[2px] bg-gradient-to-r from-indigo-500 via-purple-500 to-fuchsia-500"></div>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-[340px_1fr] min-h-[680px]">
            <aside class="bg-slate-50/80 border-r border-slate-200/80 p-6 space-y-6">
                <div class="flex items-center justify-between rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 shadow-sm">
                    <span class="text-sm font-medium text-slate-600">模型状态</span>
                    <div id="modelStatus" class="inline-flex items-center gap-2 text-sm font-semibold text-amber-700">
                        <span id="modelStatusDot" class="h-2.5 w-2.5 rounded-full bg-amber-500 status-dot-pending"></span>
                        <span id="modelStatusText" class="text-amber-700 font-semibold">等待加载</span>
                    </div>
                </div>

                <section class="space-y-3">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">模型管理</h3>
                    <div class="file-input-wrapper">
                        <button class="w-full inline-flex items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-slate-700 shadow-sm hover:border-indigo-300 hover:text-indigo-600 hover:bg-indigo-50/40 hover:shadow active:bg-indigo-50 active:scale-[0.98] transition" onclick="document.getElementById('modelInput').click()">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
                            选择并加载模型
                        </button>
                        <input type="file" id="modelInput" class="hidden" accept=".pt,.pth,.onnx,.weights">
                    </div>
                    <div class="rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-xs text-slate-500 break-all shadow-sm">
                        当前模型路径：<span id="modelPath" class="text-slate-700 font-medium">未加载</span>
                    </div>
                </section>

                <section class="space-y-3">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">文件上传</h3>
                    <div class="file-input-wrapper">
                        <button class="w-full inline-flex items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-slate-700 shadow-sm hover:border-indigo-300 hover:text-indigo-600 hover:bg-indigo-50/40 hover:shadow active:bg-indigo-50 active:scale-[0.98] transition" onclick="document.getElementById('imageInput').click()">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                            选择图片
                        </button>
                        <input type="file" id="imageInput" class="hidden" accept="image/*">
                    </div>
                    <div class="file-input-wrapper">
                        <button class="w-full inline-flex items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-slate-700 shadow-sm hover:border-indigo-300 hover:text-indigo-600 hover:bg-indigo-50/40 hover:shadow active:bg-indigo-50 active:scale-[0.98] transition" onclick="document.getElementById('videoInput').click()">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="14" height="16" rx="2"/><path d="M16 10l6-3v10l-6-3"/></svg>
                            选择视频
                        </button>
                        <input type="file" id="videoInput" class="hidden" accept="video/*">
                    </div>
                </section>

                <section class="space-y-4">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">参数调整</h3>
                    <div>
                        <div class="mb-2 flex items-center justify-between text-sm">
                            <span class="text-slate-600">置信度阈值</span>
                            <span id="confValue" class="font-bold text-indigo-600 tabular bg-indigo-50 rounded-md px-2 py-0.5">0.50</span>
                        </div>
                        <input type="range" id="confSlider" class="range-input" min="0" max="100" value="50" style="--fill: 50%">
                    </div>
                    <div>
                        <div class="mb-2 flex items-center justify-between text-sm">
                            <span class="text-slate-600">IOU 阈值</span>
                            <span id="iouValue" class="font-bold text-indigo-600 tabular bg-indigo-50 rounded-md px-2 py-0.5">0.45</span>
                        </div>
                        <input type="range" id="iouSlider" class="range-input" min="0" max="100" value="45" style="--fill: 45%">
                    </div>
                </section>

                <section class="space-y-3 pt-1">
                    <button class="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 px-4 py-2.5 text-sm font-semibold text-white shadow-lg shadow-indigo-500/30 hover:from-indigo-500 hover:to-purple-500 hover:shadow-xl hover:shadow-indigo-500/40 active:scale-[0.98] transition disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none disabled:active:scale-100" id="detectBtn" disabled>
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        开始检测
                    </button>
                    <button class="w-full inline-flex items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-slate-700 shadow-sm hover:border-indigo-300 hover:text-indigo-600 hover:bg-indigo-50/40 hover:shadow active:bg-indigo-50 active:scale-[0.98] transition disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100" id="downloadBtn" disabled>
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l4-4m-4 4l-4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
                        下载结果
                    </button>
                </section>
            </aside>

            <section class="p-6 md:p-8 space-y-6">
                <div class="grid grid-cols-1 xl:grid-cols-2 gap-5">
                    <div class="rounded-2xl bg-white shadow-md border border-slate-200/80 p-4 card-hover animate-enter animate-enter-delay-1">
                        <h3 class="text-sm font-semibold text-slate-700 mb-3 flex items-center gap-2">
                            <span class="h-1.5 w-1.5 rounded-full bg-indigo-500"></span>
                            原始输入
                        </h3>
                        <div class="preview-content min-h-[360px] bg-slate-50 rounded-xl border border-slate-200/80 flex items-center justify-center p-3" id="inputPreview">
                            <div class="empty-state w-full h-full min-h-[336px] flex flex-col items-center justify-center gap-3 text-center px-6">
                                <span class="inline-flex items-center justify-center h-14 w-14 rounded-2xl bg-indigo-50 text-indigo-400">
                                    <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                                </span>
                                <div>
                                    <p class="text-sm font-medium text-slate-500">暂无输入</p>
                                    <p class="text-xs text-slate-400 mt-1">请从左侧选择图片或视频文件</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="rounded-2xl bg-white shadow-md border border-slate-200/80 p-4 card-hover animate-enter animate-enter-delay-2">
                        <h3 class="text-sm font-semibold text-slate-700 mb-3 flex items-center gap-2">
                            <span class="h-1.5 w-1.5 rounded-full bg-purple-500"></span>
                            检测结果
                        </h3>
                        <div class="preview-content min-h-[360px] bg-slate-50 rounded-xl border border-slate-200/80 flex items-center justify-center p-3" id="outputPreview">
                            <div class="empty-state w-full h-full min-h-[336px] flex flex-col items-center justify-center gap-3 text-center px-6">
                                <span class="inline-flex items-center justify-center h-14 w-14 rounded-2xl bg-purple-50 text-purple-400">
                                    <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>
                                </span>
                                <div>
                                    <p class="text-sm font-medium text-slate-500">等待检测</p>
                                    <p class="text-xs text-slate-400 mt-1">检测完成后，标注结果将显示在这里</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="loading flex-col gap-2.5 rounded-xl border border-indigo-100 bg-indigo-50/80 px-4 py-3.5 shadow-sm" id="loadingIndicator">
                    <div class="flex items-center gap-3">
                        <div class="h-5 w-5 border-2 border-indigo-200 border-t-indigo-600 rounded-full animate-spin shrink-0"></div>
                        <p id="loadingText" class="text-sm font-medium text-indigo-700 tabular">正在处理中，请稍候...</p>
                    </div>
                    <div class="progress-track w-full">
                        <div class="progress-fill indeterminate" id="progressBar"></div>
                    </div>
                </div>

                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 animate-enter animate-enter-delay-3">
                    <div class="rounded-2xl border border-blue-200/80 bg-gradient-to-br from-blue-50 to-white p-4 shadow-sm card-hover">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="inline-flex items-center justify-center h-8 w-8 rounded-lg bg-blue-100 text-blue-600 shadow-sm">
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M9 9h6v6H9z"/></svg>
                            </span>
                            <span class="text-xs font-medium text-slate-500">检测对象</span>
                        </div>
                        <div class="text-2xl font-extrabold text-slate-800 tabular" id="statObjects">0</div>
                    </div>
                    <div class="rounded-2xl border border-emerald-200/80 bg-gradient-to-br from-emerald-50 to-white p-4 shadow-sm card-hover">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="inline-flex items-center justify-center h-8 w-8 rounded-lg bg-emerald-100 text-emerald-600 shadow-sm">
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 17l9 4 9-4"/><path d="M3 12l9 4 9-4"/></svg>
                            </span>
                            <span class="text-xs font-medium text-slate-500">类别数量</span>
                        </div>
                        <div class="text-2xl font-extrabold text-slate-800 tabular" id="statClasses">0</div>
                    </div>
                    <div class="rounded-2xl border border-amber-200/80 bg-gradient-to-br from-amber-50 to-white p-4 shadow-sm card-hover">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="inline-flex items-center justify-center h-8 w-8 rounded-lg bg-amber-100 text-amber-600 shadow-sm">
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
                            </span>
                            <span class="text-xs font-medium text-slate-500">处理时间</span>
                        </div>
                        <div class="text-2xl font-extrabold text-slate-800 tabular" id="statTime">0ms</div>
                    </div>
                    <div class="rounded-2xl border border-rose-200/80 bg-gradient-to-br from-rose-50 to-white p-4 shadow-sm card-hover">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="inline-flex items-center justify-center h-8 w-8 rounded-lg bg-rose-100 text-rose-600 shadow-sm">
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h3l3-8 4 16 3-8h5"/></svg>
                            </span>
                            <span class="text-xs font-medium text-slate-500">平均置信度</span>
                        </div>
                        <div class="text-2xl font-extrabold text-slate-800 tabular" id="statConf">0%</div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        let modelLoaded = false;
        let currentFile = null;
        let currentFileType = null;

        const modelStatusDot = document.getElementById('modelStatusDot');
        const modelStatusText = document.getElementById('modelStatusText');
        const modelInput = document.getElementById('modelInput');
        const modelPath = document.getElementById('modelPath');
        const detectBtn = document.getElementById('detectBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const confSlider = document.getElementById('confSlider');
        const iouSlider = document.getElementById('iouSlider');
        const confValue = document.getElementById('confValue');
        const iouValue = document.getElementById('iouValue');
        const inputPreview = document.getElementById('inputPreview');
        const outputPreview = document.getElementById('outputPreview');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const loadingText = document.getElementById('loadingText');
        const progressBar = document.getElementById('progressBar');
        const imageInput = document.getElementById('imageInput');
        const videoInput = document.getElementById('videoInput');
        let progressTimer = null;

        async function parseApiResponse(response) {
            const contentType = response.headers.get('content-type') || '';
            if (contentType.includes('application/json')) {
                return await response.json();
            }
            const text = await response.text();
            return {
                success: false,
                message: text || `请求失败（HTTP ${response.status}）`
            };
        }

        function setModelStatus(loaded) {
            if (loaded) {
                modelStatusDot.classList.remove('bg-amber-500', 'status-dot-pending');
                modelStatusDot.classList.add('bg-emerald-500', 'status-dot-ok');
                modelStatusText.textContent = '已加载';
                modelStatusText.className = 'text-emerald-700 font-semibold';
            } else {
                modelStatusDot.classList.remove('bg-emerald-500', 'status-dot-ok');
                modelStatusDot.classList.add('bg-amber-500', 'status-dot-pending');
                modelStatusText.textContent = '等待加载';
                modelStatusText.className = 'text-amber-700 font-semibold';
            }
        }

        function syncSliderFill(slider) {
            const min = Number(slider.min) || 0;
            const max = Number(slider.max) || 100;
            const pct = ((slider.value - min) / (max - min)) * 100;
            slider.style.setProperty('--fill', pct + '%');
        }

        confSlider.addEventListener('input', (e) => {
            confValue.textContent = (e.target.value / 100).toFixed(2);
            syncSliderFill(e.target);
        });

        iouSlider.addEventListener('input', (e) => {
            iouValue.textContent = (e.target.value / 100).toFixed(2);
            syncSliderFill(e.target);
        });

        function updateDetectButtonState() {
            detectBtn.disabled = !(modelLoaded && currentFile);
        }

        modelInput.addEventListener('change', async () => {
            const modelFile = modelInput.files[0];
            if (!modelFile) {
                return;
            }

            const formData = new FormData();
            formData.append('model', modelFile);

            loadingIndicator.classList.add('active');
            setProgressIndeterminate();
            loadingText.textContent = '正在加载模型...';

            try {
                const response = await fetch('/api/load_model', {
                    method: 'POST',
                    body: formData
                });

                const result = await parseApiResponse(response);

                if (result.success) {
                    modelLoaded = true;
                    setModelStatus(true);
                    modelPath.textContent = result.model_path || modelFile.name;
                    updateDetectButtonState();
                } else {
                    modelLoaded = false;
                    setModelStatus(false);
                    modelPath.textContent = '未加载';
                    updateDetectButtonState();
                    alert('模型加载失败：' + result.message);
                }
            } catch (error) {
                modelLoaded = false;
                setModelStatus(false);
                modelPath.textContent = '未加载';
                updateDetectButtonState();
                alert('模型加载出错：' + error.message);
            } finally {
                loadingIndicator.classList.remove('active');
                loadingText.textContent = '正在处理中，请稍候...';
            }
        });

        imageInput.addEventListener('click', () => {
            imageInput.value = '';
        });

        videoInput.addEventListener('click', () => {
            videoInput.value = '';
        });

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                currentFile = file;
                currentFileType = 'image';
                previewFile(file, 'image');
                updateDetectButtonState();
            }
        });

        videoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                currentFile = file;
                currentFileType = 'video';
                previewFile(file, 'video');
                updateDetectButtonState();
            }
        });

        function outputEmptyState() {
            return `
                <div class="empty-state w-full h-full min-h-[336px] flex flex-col items-center justify-center gap-3 text-center px-6">
                    <span class="inline-flex items-center justify-center h-14 w-14 rounded-2xl bg-purple-50 text-purple-400">
                        <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>
                    </span>
                    <div>
                        <p class="text-sm font-medium text-slate-500">等待检测</p>
                        <p class="text-xs text-slate-400 mt-1">检测完成后，标注结果将显示在这里</p>
                    </div>
                </div>`;
        }

        function previewFile(file, type) {
            const url = URL.createObjectURL(file);

            if (type === 'image') {
                inputPreview.innerHTML = `<img src="${url}" alt="Input Image">`;
            } else {
                inputPreview.innerHTML = `<video src="${url}" controls preload="metadata" playsinline></video>`;
            }

            outputPreview.innerHTML = outputEmptyState();
        }

        function setProgressIndeterminate() {
            progressBar.classList.add('indeterminate');
            progressBar.style.width = '';
        }

        function setProgressValue(pct) {
            progressBar.classList.remove('indeterminate');
            progressBar.style.width = Math.max(0, Math.min(100, pct)) + '%';
        }

        function startProgressPolling(isVideo) {
            if (progressTimer) {
                clearInterval(progressTimer);
            }
            if (!isVideo) {
                setProgressIndeterminate();
            }
            progressTimer = setInterval(async () => {
                try {
                    const response = await fetch('/api/detect_progress');
                    const progress = await parseApiResponse(response);
                    if (!progress.success && progress.running === undefined) {
                        loadingText.textContent = progress.message || '正在处理中，请稍候...';
                        return;
                    }
                    if (isVideo) {
                        const total = progress.total_frames || 0;
                        const done = progress.processed_frames || 0;
                        const pct = progress.progress || 0;
                        setProgressValue(pct);
                        loadingText.textContent =
                            `视频检测中：${pct}% (${done}/${total}) | 处理FPS：${(progress.current_fps || 0).toFixed(2)}`;
                    } else {
                        loadingText.textContent = progress.message || '正在处理中，请稍候...';
                    }
                } catch (error) {
                    loadingText.textContent = '正在处理中，请稍候...';
                }
            }, 500);
        }

        function stopProgressPolling() {
            if (progressTimer) {
                clearInterval(progressTimer);
                progressTimer = null;
            }
            loadingText.textContent = '正在处理中，请稍候...';
        }

        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function animateNumber(el, endValue, suffix) {
            if (reduceMotion) {
                el.textContent = endValue + suffix;
                return;
            }
            const startText = el.textContent.replace(/[^\d.-]/g, '');
            const startValue = parseFloat(startText) || 0;
            const duration = 600;
            const startTime = performance.now();

            function frame(now) {
                const t = Math.min((now - startTime) / duration, 1);
                const eased = 1 - Math.pow(1 - t, 3);
                const value = startValue + (endValue - startValue) * eased;
                el.textContent = (Number.isInteger(endValue) ? Math.round(value) : value.toFixed(1)) + suffix;
                if (t < 1) {
                    requestAnimationFrame(frame);
                } else {
                    el.textContent = endValue + suffix;
                }
            }
            requestAnimationFrame(frame);
        }

        detectBtn.addEventListener('click', async () => {
            if (!currentFile) {
                alert('请先上传文件！');
                return;
            }

            const formData = new FormData();
            formData.append('file', currentFile);
            formData.append('conf_threshold', confSlider.value / 100);
            formData.append('iou_threshold', iouSlider.value / 100);
            formData.append('file_type', currentFileType);

            loadingIndicator.classList.add('active');
            detectBtn.disabled = true;
            startProgressPolling(currentFileType === 'video');

            try {
                const response = await fetch('/api/detect', {
                    method: 'POST',
                    body: formData
                });

                const result = await parseApiResponse(response);

                if (result.success) {
                    if (currentFileType === 'image') {
                        outputPreview.innerHTML = `<a href="${result.output_path}" target="_blank" rel="noopener" title="点击在新窗口查看原图"><img src="${result.output_path}" alt="Detection Result" class="cursor-zoom-in"></a>`;
                    } else {
                        const outputUrl = `${result.output_path}?t=${Date.now()}`;
                        const fileName = (result.output_path || '').split('/').pop();
                        const fallbackUrl = fileName ? `/api/preview_video/${encodeURIComponent(fileName)}?t=${Date.now()}` : '';
                        outputPreview.innerHTML = `<video id="outputVideoPlayer" src="${outputUrl}" controls preload="metadata" playsinline></video>`;
                        const outputVideoPlayer = document.getElementById('outputVideoPlayer');
                        outputVideoPlayer.addEventListener('error', () => {
                            if (!fallbackUrl) {
                                outputPreview.innerHTML = '<div class="text-slate-400 text-sm">视频无法预览，请下载后查看</div>';
                                return;
                            }
                            outputPreview.innerHTML = `
                                <div class="w-full">
                                    <img src="${fallbackUrl}" alt="Detection Video Stream Preview" class="w-full max-h-[360px] object-contain rounded-xl border border-slate-200">
                                    <p class="mt-2 text-xs text-slate-500">当前浏览器不支持直接播放该编码，已切换为兼容预览流。</p>
                                </div>`;
                        }, { once: true });
                    }

                    animateNumber(document.getElementById('statObjects'), result.stats.total_objects, '');
                    animateNumber(document.getElementById('statClasses'), result.stats.num_classes, '');
                    animateNumber(document.getElementById('statTime'), result.stats.process_time, 'ms');
                    animateNumber(document.getElementById('statConf'), result.stats.avg_confidence, '%');

                    downloadBtn.disabled = false;
                } else {
                    alert('检测失败：' + result.message);
                }
            } catch (error) {
                alert('检测出错：' + error.message);
            } finally {
                stopProgressPolling();
                loadingIndicator.classList.remove('active');
                detectBtn.disabled = false;
            }
        });

        downloadBtn.addEventListener('click', () => {
            window.location.href = '/api/download';
        });
    </script>
</body>
</html>
